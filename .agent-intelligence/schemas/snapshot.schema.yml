version: 1
title: FLIXO Engineering Intelligence Source Snapshot
type: object
additionalProperties: false
required:
  - snapshot_id
  - captured_at
  - url
  - source_type
  - stability
  - vendor_affiliated
  - evidence_kind
  - content
properties:
  snapshot_id:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$"
    maxLength: 96
  captured_at:
    type: string
    format: iso8601-z
  url:
    type: string
    minLength: 1
    maxLength: 2048
  source_type:
    type: string
    enum: [official_docs, release_notes, repository, benchmark, engineering_blog, community, marketing]
  stability:
    type: string
    enum: [stable, volatile, unknown]
  vendor_affiliated:
    type: boolean
  evidence_kind:
    type: string
    enum: [fact, benchmark, release, documentation, opinion, marketing]
  content:
    type: string
    minLength: 1
    maxLength: 1048576
