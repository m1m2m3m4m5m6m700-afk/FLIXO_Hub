name = "flixo-agent-watchdog"
main = "src/index.ts"
compatibility_date = "2026-10-07"
workers_dev = false

[limits]
cpu_ms = 1000
subrequests = 10

[vars]
GITHUB_REPOSITORY = "m1m2m3m4m5m6m700-afk/FLIXO_Hub"
GITHUB_DISPATCH_WORKFLOW = "agent-runner.yml"
GITHUB_DISPATCH_REF = "execution"
WATCHDOG_AUTO_DISPATCH = "false"
WATCHDOG_ENABLE_HUNG_CANCEL = "false"
MAX_BODY_BYTES = "32768"
MAX_RESPONSE_BYTES = "16384"
MAX_RPC_BODY_BYTES = "65536"
MAX_AGENT_ID_BYTES = "128"
MAX_TASK_ID_BYTES = "128"
MAX_CHECKPOINT_BYTES = "4096"
MAX_WORKFLOW_BYTES = "256"
MAX_RUN_URL_BYTES = "512"
MAX_RUN_IDENTITY_BYTES = "64"
MAX_REASON_BYTES = "128"
MAX_DISPATCH_LOG_ENTRIES = "256"
MAX_STATUS_AGENTS = "64"
MAX_AGENTS = "64"
MAX_CONSECUTIVE_FAILS = "3"
MAX_DISPATCHES_PER_HOUR = "4"
DISPATCH_WINDOW_MS = "3600000"
MIN_GAP_MINUTES = "15"
STALE_RUNNING_MS = "1800000"
PENDING_NOT_CONTINUED_MS = "900000"
CANCEL_STALE_RUNNING_MS = "3600000"

[[durable_objects.bindings]]
name = "AGENT_STATE"
class_name = "AgentState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentState"]
