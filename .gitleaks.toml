title = "FLIXO AI Tools Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Known non-secret localStorage key in historical communication store commits"
  condition = "AND"
  commits = [
    "c5184d553a96199dc91001e7d775a69078ca65cd",
    "1ced2a86f8a08311341342cbc446ebd5f8959fe4",
  ]
  paths = [
    '''^src/lib/communicationStore\.ts$''',
  ]

[[rules]]
id = "jwt"

  [[rules.allowlists]]
  description = "Known public sample JWT used only by the JWT decoder demo"
  condition = "AND"
  commits = [
    "c5184d553a96199dc91001e7d775a69078ca65cd",
    "1ced2a86f8a08311341342cbc446ebd5f8959fe4",
  ]
  paths = [
    '''^src/lib/tool-runtime/tools/jwt-decoder\.tsx
'',
  ]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Historical adversarial test expression, not a credential value"
  condition = "AND"
  commits = ["9ed9a5f1a518defb915f1391a0c03f7e6d925a44"]
  paths = ["'''^scripts/ci/test-auto-repair-chair1-audit\.mjs
''"]

  [[rules.allowlists]]
