title = "FLIXO AI Tools Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Known non-secret localStorage key in historical communication store commits"
  condition = "AND"
  commits = [
    "c5184d553a96199dc91001e7d775a69078ca65cd",
    "1ced2a86f8a08311341342cbc446ebd5f8959fe4",
  ]
  paths = [
    '''^src/lib/communicationStore\.ts$''',
  ]

  [[rules.allowlists]]
  description = "Verified non-secret Chair1 adversarial test fixture in historical test commit"
  condition = "AND"
  commits = [
    "a4d85af76b8dc19116ebb1043fb1cafeb36fbe54",
  ]
  paths = [
    '''^scripts/ci/test-chair1-central-lease-adversarial\.mjs$''',
  ]

  [[rules.allowlists]]
  description = "Verified non-secret Chair1 approval test fixture in historical test commit"
  condition = "AND"
  commits = [
    "9ed9a5f1a518defb915f1391a0c03f7e6d925a44",
  ]
  paths = [
    '''^scripts/ci/test-auto-repair-chair1-audit\.mjs$''',
  ]

  [[rules.allowlists]]
  description = "Verified empty configuration placeholder in historical environment example"
  condition = "AND"
  commits = [
    "d034d5a06bdedf2c924bfd86a700d00461b46ca0",
  ]
  paths = [
    '''^\.env\.example$''',
  ]

[[rules]]
id = "cloudflare-api-key"

  [[rules.allowlists]]
  description = "Verified documentation-only commit SHA falsely classified as a Cloudflare key"
  condition = "AND"
  commits = [
    "112bc0d8d4d104a4ade23aef8daf69a09379a9cc",
  ]
  paths = [
    '''^المهام\.md$''',
  ]

[[rules]]
id = "jwt"

  [[rules.allowlists]]
  description = "Known public sample JWT used only by the JWT decoder demo"
  condition = "AND"
  commits = [
    "c5184d553a96199dc91001e7d775a69078ca65cd",
    "1ced2a86f8a08311341342cbc446ebd5f8959fe4",
  ]
  paths = [
