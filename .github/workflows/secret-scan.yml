name: FLIXO Secret Scan

on:
  pull_request:
    branches: [main, execution]
  push:
    branches: [main, execution]
  schedule:
    - cron: "47 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PR-or-push-candidate
            ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          - label: execution
            ref: refs/heads/execution
          - label: main
            ref: refs/heads/main
    steps:
      - name: Checkout exact scan target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: Verify exact scan SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "SCAN_TARGET=${{ matrix.label }}"
          echo "SCAN_SHA=$actual"
          if [ "${{ matrix.label }}" = "PR-or-push-candidate" ]; then
            expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
            test "$actual" = "$expected"
          elif [ "${{ matrix.label }}" = "execution" ]; then
            test "$(git rev-parse refs/heads/execution)" = "$actual"
          else
            test "$(git rev-parse refs/heads/main)" = "$actual"
          fi
      - name: Secret scan full history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          args: git . --config .gitleaks.toml --redact --no-banner --exit-code 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
