name: FLIXO Secret Scan

on:
  pull_request:
    branches: [main, execution]
  push:
    branches: [main, execution]
  schedule:
    - cron: "47 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PR-or-push-candidate
            ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          - label: execution
            ref: refs/heads/execution
          - label: main
            ref: refs/heads/main
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout exact scan target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: Verify exact scan SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "SCAN_TARGET=${{ matrix.label }}"
          echo "SCAN_SHA=$actual"
          if [ "${{ matrix.label }}" = "PR-or-push-candidate" ]; then
            expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
            test "$actual" = "$expected"
          elif [ "${{ matrix.label }}" = "execution" ]; then
            test "$(git rev-parse refs/heads/execution)" = "$actual"
          else
            test "$(git rev-parse refs/heads/main)" = "$actual"
          fi
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail-with-body --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          test -x ./gitleaks
          ./gitleaks version
      - name: Secret scan full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
