name: CELL Agent Fleet

on:
  push:
    branches: [execution]

permissions:
  contents: read

concurrency:
  group: cell-agent-fleet-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  typecheck-agent:
    name: CELL Agent / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exact SHA fence
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Contract typecheck
        run: npm run typecheck:contracts
      - name: Application typecheck
        run: npm run typecheck

  redteam-agent:
    name: CELL Agent / Red Team
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Hard-control contract
        shell: bash
        run: |
          set -o pipefail
          npm run test:cell-hard-control 2>&1 | tee cell-redteam-output.txt
      - name: Runtime contract
        run: npm run test:cell-runtime
      - name: Assignment and delegation contract
        run: npm run test:cell-assignment
      - name: Upload red-team evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cell-redteam-evidence-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: cell-redteam-output.txt
      - name: Exact SHA fence
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

  runtime-agent:
    name: CELL Agent / Runtime Assurance
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://flixoai.m1m2m3m4m5m6m700.workers.dev
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Core regression suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:core 2>&1 | tee cell-runtime-output.txt
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cell-runtime-evidence-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: cell-runtime-output.txt
      - name: Exact SHA fence
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
