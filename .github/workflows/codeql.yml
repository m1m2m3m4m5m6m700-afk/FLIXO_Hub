name: FLIXO CodeQL

on:
  pull_request:
    branches: [main, execution]
  push:
    branches: [main, execution]
  schedule:
    - cron: "31 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Analyze CodeQL without SARIF upload
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          upload: never

      - name: Locate exact CodeQL SARIF
        id: sarif
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codeql-sarif
          sarif_files=()
          for candidate in             "$GITHUB_WORKSPACE/results/javascript.sarif"             "$GITHUB_WORKSPACE/../results/javascript.sarif"             "$RUNNER_TEMP/codeql_databases/javascript/results/javascript.sarif"; do
            if [ -f "$candidate" ]; then sarif_files+=("$candidate"); fi
          done
          test "${#sarif_files[@]}" -eq 1
          cp "${sarif_files[0]}" "codeql-sarif/${{ matrix.language }}.sarif"
          echo "path=codeql-sarif/${{ matrix.language }}.sarif" >> "$GITHUB_OUTPUT"

      - name: Fail closed on CodeQL findings
        run: node scripts/ci/verify-codeql-clean.mjs "${{ steps.sarif.outputs.path }}"

      - name: Upload durable CodeQL evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flixo-codeql-clean-${{ github.sha }}-${{ matrix.language }}
          path: codeql-sarif
          if-no-files-found: error
          retention-days: 90
