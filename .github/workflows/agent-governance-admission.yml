name: FLIXO Agent Governance Admission Gate

on:
  workflow_dispatch:
    inputs:
      mission_id:
        description: "Mission identifier"
        required: true
        type: string
      target_sha:
        description: "Exact 40-character commit SHA to admit for execution"
        required: true
        type: string
      parent_run_id:
        description: "Optional parent workflow run identifier"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  admission:
    name: Read-only execution admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable target identity
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"

      - name: Run canonical governance verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_BRANCH: main
          GOVERNANCE_MODE: strict
        run: scripts/ci/check-governance.sh

      - name: Evaluate execution admission
        shell: bash
        env:
          MISSION_ID: ${{ inputs.mission_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          POLICY_VERSION: "1.4.1"
        run: |
          set -euo pipefail
          node scripts/ci/admission-gate.mjs > admission.json
          cat admission.json

      - name: Publish SHA-bound admission artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flixo-admission-${{ inputs.mission_id }}-${{ inputs.target_sha }}
          path: admission.json
          if-no-files-found: error
          retention-days: 30
