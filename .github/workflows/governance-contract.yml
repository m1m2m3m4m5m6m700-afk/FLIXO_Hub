name: FLIXO Governance Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'STATE.md'
      - 'DECISIONS.md'
      - 'MEMORY.md'
      - '.github/CODEOWNERS'
      - '.github/workflows/agent-governance-admission.yml'
      - '.github/workflows/agent-governance-telemetry.yml'
      - '.github/workflows/agent-blocked-channel.yml'
      - 'docs/AGENT-LEAD-MEMORY-GOVERNANCE-v1.3-DRAFT.md'
      - 'scripts/ci/admission-gate.mjs'
      - 'scripts/ci/agent-governance-metrics.mjs'
      - 'scripts/ci/test-admission-gate.mjs'
      - 'scripts/ci/test-agent-governance-metrics.mjs'
      - 'scripts/ci/check-agent-blocked-channel.mjs'
      - 'scripts/ci/test-agent-blocked-channel.mjs'
      - 'scripts/ci/test-workflow-exact-sha-contract.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Governance contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:admission-gate
      - run: node --test scripts/ci/test-agent-governance-metrics.mjs
      - run: node --test scripts/ci/test-agent-blocked-channel.mjs
      - run: node --test scripts/ci/test-workflow-exact-sha-contract.mjs
