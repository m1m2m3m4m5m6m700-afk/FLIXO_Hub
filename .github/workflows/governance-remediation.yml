name: One-time FLIXO governance remediation

on:
  push:
    branches: [execution]
    paths:
      - .github/workflows/governance-remediation.yml

permissions:
  administration: write
  contents: write

jobs:
  harden-main:
    if: contains(github.event.head_commit.message, 'governance-remediation')
    runs-on: ubuntu-latest
    steps:
      - name: Apply main branch ruleset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ruleset.json <<'JSON'
          {
            "name": "FLIXO-MAIN-PROTECTION",
            "target": "branch",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["refs/heads/main"],
                "exclude": []
              }
            },
            "rules": [
              { "type": "deletion" },
              { "type": "non_fast_forward" },
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 1,
                  "dismiss_stale_reviews_on_push": true,
                  "required_reviewers": [],
                  "require_code_owner_review": true,
                  "require_last_push_approval": true,
                  "required_review_thread_resolution": true,
                  "require_extra_approval_for_unattributed_changes": true,
                  "allowed_merge_methods": ["merge", "squash", "rebase"]
                }
              },
              {
                "type": "required_status_checks",
                "parameters": {
                  "strict_required_status_checks_policy": true,
                  "do_not_enforce_on_create": false,
                  "required_status_checks": [
                    { "context": "trust-gate" },
                    { "context": "Exact-SHA promotion proof" }
                  ]
                }
              }
            ],
            "bypass_actors": []
          }
          JSON
          gh api --method PUT "repos/$GITHUB_REPOSITORY/rulesets/23854302" --input /tmp/ruleset.json >/tmp/ruleset-response.json
          gh api "repos/$GITHUB_REPOSITORY/rulesets/23854302" > /tmp/ruleset-verified.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/ruleset-verified.json','utf8'));
          const pr = (r.rules || []).find(x => x.type === 'pull_request')?.parameters || {};
          const rs = (r.rules || []).find(x => x.type === 'required_status_checks')?.parameters || {};
          if (r.enforcement !== 'active') throw new Error('RULESET_NOT_ACTIVE');
          if (pr.required_approving_review_count !== 1) throw new Error('APPROVAL_COUNT_NOT_HARDENED');
          if (pr.require_code_owner_review !== true) throw new Error('CODEOWNER_NOT_REQUIRED');
          if (pr.dismiss_stale_reviews_on_push !== true) throw new Error('STALE_REVIEWS_NOT_DISMISSED');
          if (pr.require_last_push_approval !== true) throw new Error('LAST_PUSH_APPROVAL_NOT_REQUIRED');
          if (pr.required_review_thread_resolution !== true) throw new Error('THREAD_RESOLUTION_NOT_REQUIRED');
          if (rs.strict_required_status_checks_policy !== true) throw new Error('STRICT_CHECKS_NOT_REQUIRED');
          console.log('GOVERNANCE_REMEDIATION=PASS');
          NODE
      - name: Remove one-time remediation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          FILE_PATH: .github/workflows/governance-remediation.yml
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE_PATH?ref=execution" --jq .sha)"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$FILE_PATH" \
            -f message="chore(governance): remove one-time remediation workflow" \
            -f sha="$sha" \
            -f branch=execution >/tmp/delete-response.json
