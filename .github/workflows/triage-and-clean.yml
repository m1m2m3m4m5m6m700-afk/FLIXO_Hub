name: FLIXO Agent-3 Triage and Clean
# Read-only candidate analysis; publication is isolated to a privileged job that never executes candidate scripts.

on:
  push:
    branches: [execution]
    paths:
      - '.agent-intelligence/validated/**'
      - '.agent-intelligence/scripts/triage.py'
      - '.agent-intelligence/scripts/reaper.py'
      - '.agent-intelligence/feature-freeze.json'
      - '.github/workflows/triage-and-clean.yml'
  pull_request:
    branches: [execution]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flixo-agent3-triage-clean
  cancel-in-progress: true

jobs:
  pipeline:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Agent-3 mandatory triage pipeline
    permissions:
      contents: read
    env:
      FLIXO_TARGET_BRANCH: execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate invocation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "m1m2m3m4m5m6m700-afk/FLIXO_Hub"
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = "refs/heads/execution" ;;
            pull_request) test "$(jq -r '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")" = "$GITHUB_REPOSITORY"; test "$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")" = "execution" ;;
            schedule) ;;
            workflow_dispatch) test "$GITHUB_REF" = "refs/heads/execution"; test "$GITHUB_ACTOR" = "m1m2m3m4m5m6m700-afk" ;;
            *) echo "FAIL_CLOSED: unsupported triage event"; exit 1 ;;
          esac

      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Resolve exact candidate SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_SHA="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            test "$GITHUB_REF_NAME" = "execution"
            TARGET_SHA="$GITHUB_SHA"
          else
            git fetch origin execution --no-tags
            TARGET_SHA="$(git rev-parse refs/remotes/origin/execution)"
          fi
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Mandatory contract, security and scale tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .agent-intelligence/scripts/triage.py .agent-intelligence/scripts/reaper.py
          python3 tests/security/ci/agent-3-triage.test.py

      - name: Execute mandatory pipeline without silent skips
        shell: bash
        run: |
          set +e
          : > agent3-stage-results.txt
          failures=0
          stage () {
            name="$1"; shift
            echo "=== $name ==="
            "$@"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "$name=PASS" | tee -a agent3-stage-results.txt
            else
              echo "$name=FAIL" | tee -a agent3-stage-results.txt
              failures=$((failures+1))
            fi
          }
          stage ValidatorAdmission bash -c 'mkdir -p .agent-intelligence/validated && python3 .agent-intelligence/scripts/validate.py --all --json > .agent-intelligence/validated/validator-results.json'
          stage TriageDedupPriorityQueue python3 .agent-intelligence/scripts/triage.py run
          stage ReaperTTLSuppression python3 .agent-intelligence/scripts/reaper.py
          stage GeneratedViewAndStateAudit python3 .agent-intelligence/scripts/triage.py verify
          echo "failures=$failures" >> agent3-stage-results.txt
          test "$failures" -eq 0

      - name: Remove ephemeral validator output
        shell: bash
        run: |
          set -euo pipefail
          rm -f .agent-intelligence/validated/validator-results.json

      - name: Create immutable publication patch
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$TARGET_SHA" > agent3-publication-sha.txt
          git diff --binary --full-index > agent3-publication.patch
          git diff --name-only > agent3-changed-files.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .agent-intelligence/review-queue/*|.agent-intelligence/graveyard/*|.agent-intelligence/handoffs/*|التطوير.md)
                ;;
              *)
                echo "FAIL_CLOSED: unexpected mutation: $path"
                exit 1
                ;;
            esac
          done < agent3-changed-files.txt

      - name: Upload exact-SHA publication evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flixo-agent3-publication-${{ github.run_id }}
          path: |
            agent3-publication.patch
            agent3-publication-sha.txt
            agent3-changed-files.txt
            agent3-stage-results.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload PR evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flixo-agent3-pr-${{ github.run_id }}
          path: agent3-stage-results.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce no-false-green
        shell: bash
        run: |
          set -euo pipefail
          test -s agent3-stage-results.txt
          grep -q '^ValidatorAdmission=PASS$' agent3-stage-results.txt
          grep -q '^TriageDedupPriorityQueue=PASS$' agent3-stage-results.txt
          grep -q '^ReaperTTLSuppression=PASS$' agent3-stage-results.txt
          grep -q '^GeneratedViewAndStateAudit=PASS$' agent3-stage-results.txt
          ! grep -q '=FAIL$' agent3-stage-results.txt

  publish:
    name: Publish precomputed Agent-3 mutation only
    needs: pipeline
    if: ${{ github.event_name != 'pull_request' && needs.pipeline.result == 'success' }}
    permissions:
      contents: write
    env:
      FLIXO_TARGET_BRANCH: execution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate publication boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "m1m2m3m4m5m6m700-afk/FLIXO_Hub"
          case "$GITHUB_EVENT_NAME" in
            push) test "$GITHUB_REF" = "refs/heads/execution" ;;
            schedule) ;;
            workflow_dispatch) test "$GITHUB_REF" = "refs/heads/execution"; test "$GITHUB_ACTOR" = "m1m2m3m4m5m6m700-afk" ;;
            *) echo "FAIL_CLOSED: publication event is not allowed"; exit 1 ;;
          esac

      - name: Checkout current execution head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact-SHA publication patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flixo-agent3-publication-${{ github.run_id }}
          path: agent3-publication

      - name: Verify publication lineage and scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat agent3-publication/agent3-publication-sha.txt)"
          test "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$
          git fetch origin execution --no-tags
          CURRENT_SHA="$(git rev-parse refs/remotes/origin/execution)"
          test "$CURRENT_SHA" = "$EXPECTED_SHA"
          cp agent3-publication/agent3-publication.patch /tmp/agent3-publication.patch
          git apply --check /tmp/agent3-publication.patch
          git apply /tmp/agent3-publication.patch
          git diff --name-only > /tmp/agent3-applied-files.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .agent-intelligence/review-queue/*|.agent-intelligence/graveyard/*|.agent-intelligence/handoffs/*|التطوير.md)
                ;;
              *)
                echo "FAIL_CLOSED: unexpected applied mutation: $path"
                exit 1
                ;;
            esac
          done < /tmp/agent3-applied-files.txt

      - name: Publish with explicit ephemeral authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "NO_GENERATED_MUTATIONS=PASS"
            exit 0
          fi
          git config user.name "flixo-agent3[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-intelligence/review-queue .agent-intelligence/graveyard .agent-intelligence/handoffs التطوير.md
          git diff --cached --quiet && echo "NO_STAGED_MUTATIONS=PASS" && exit 0
          git commit -m "chore(agent3): reconcile triage queue"
          git fetch origin execution --no-tags
          test "$(git rev-parse refs/remotes/origin/execution)" = "$(git rev-parse HEAD^)"
          git -c "http.extraheader=AUTHORIZATION: bearer $GITHUB_TOKEN" push origin "HEAD:execution"

      - name: Verify resulting exact SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin execution --no-tags
          RESULT_SHA="$(git rev-parse refs/remotes/origin/execution)"
          test "$(git rev-parse HEAD)" = "$RESULT_SHA" 
