name: FLIXO Proposal Integrity

on:
  push:
    branches: [execution, main]
    paths:
      - '.agent-intelligence/**'
      - 'package.json'
  pull_request:
    branches: [execution, main]
    paths:
      - '.agent-intelligence/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flixo-proposal-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Deterministic proposal integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Schema V4 contract
        run: python3 .agent-intelligence/schemas/test_schema.py
      - name: Validator security suite
        id: validator-tests
        run: |
          set -o pipefail
          python3 .agent-intelligence/scripts/test_validate.py 2>&1 | tee agent2-test-output.txt

      - name: Upload validator failure evidence
        if: failure() && steps.validator-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent2-validator-failure
          path: agent2-test-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Validate all inbox proposals
        run: python3 .agent-intelligence/scripts/validate.py --all --json
