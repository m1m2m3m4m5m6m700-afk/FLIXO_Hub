name: FLIXO Proposal Integrity

on:
  push:
    branches: [execution, main]
    paths:
      - '.agent-intelligence/**'
      - 'package.json'
  pull_request:
    branches: [execution, main]
    paths:
      - '.agent-intelligence/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flixo-proposal-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Deterministic proposal integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Schema V4 contract
        run: python3 .agent-intelligence/schemas/test_schema.py
      - name: Validator security suite
        run: python3 .agent-intelligence/scripts/test_validate.py
      - name: Validate all inbox proposals
        run: python3 .agent-intelligence/scripts/validate.py --all --json
