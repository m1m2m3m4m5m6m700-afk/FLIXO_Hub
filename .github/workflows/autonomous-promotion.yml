name: FLIXO Autonomous Promotion Controller

on:
  push:
    branches: [execution]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: flixo-autonomous-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Validate canonical execution PR without promoting main
    if: >-
      github.repository == 'm1m2m3m4m5m6m700-afk/FLIXO_Hub' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/execution'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify invocation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "m1m2m3m4m5m6m700-afk/FLIXO_Hub"
          test "$GITHUB_REF" = "refs/heads/execution"
          test "$GITHUB_EVENT_NAME" = "push"

      - name: Checkout exact execution candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact execution SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Find or create canonical execution PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head execution --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head execution --base main --title "feat(cell): autonomous execution integration" --body "Canonical autonomous promotion path. Agents publish to execution; live GitHub governance and required automated checks govern promotion to main. Conversational approval is not an implementation prerequisite; release approval remains a live governance control.")"
            number="${url##*/}"
          fi
          test "$number" -gt 0
          echo "PR_NUMBER=$number" >> "$GITHUB_ENV"

      - name: Verify autonomous live governance before enabling auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_MODE: autonomous
          GOVERNANCE_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/check-governance.sh

      - name: Record protected promotion state without merging
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,url,state,baseRefName,headRefName,headRefOid,autoMergeRequest,reviewDecision)"
          pr_number="$(printf '%s' "$pr_json" | jq -r '.number')"
          pr_url="$(printf '%s' "$pr_json" | jq -r '.url')"
          pr_state="$(printf '%s' "$pr_json" | jq -r '.state')"
          base_ref="$(printf '%s' "$pr_json" | jq -r '.baseRefName')"
          head_ref="$(printf '%s' "$pr_json" | jq -r '.headRefName')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
          review_decision="$(printf '%s' "$pr_json" | jq -r '.reviewDecision // "REVIEW_REQUIRED"')"
          auto_merge_requested="$(printf '%s' "$pr_json" | jq -r '.autoMergeRequest != null')"
          test "$pr_number" = "$PR_NUMBER"
          test "$pr_state" = "OPEN"
          test "$base_ref" = "main"
          test "$head_ref" = "execution"
          test "$head_sha" = "$EXPECTED_SHA"
          {
            printf '### Protected promotion gate\n\n'
            printf -- '- PR: [#%s](%s)\n' "$pr_number" "$pr_url"
            printf -- '- Exact execution SHA: `%s`\n' "$EXPECTED_SHA"
            printf -- '- Live main governance check: `PASS`\n'
            printf -- '- GitHub review decision reported: `%s`\n' "$review_decision"
            printf -- '- Auto-merge already enabled before this run: `%s`\n' "$auto_merge_requested"
            printf -- '- Controller action: no merge or auto-merge mutation; required human review and status checks remain authoritative.\n'
            printf -- '- State: `WAITING_FOR_PROTECTED_REVIEW_AND_REQUIRED_CHECKS`\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PROMOTION_STATUS=WAITING_FOR_PROTECTED_REVIEW_AND_REQUIRED_CHECKS"
