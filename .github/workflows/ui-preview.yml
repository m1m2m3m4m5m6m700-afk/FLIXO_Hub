name: FLIXO UI Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flixo-ui-preview
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/execution' && github.repository == 'm1m2m3m4m5m6m700-afk/FLIXO_Hub' && github.actor == 'm1m2m3m4m5m6m700-afk' }}
    name: Publish execution UI preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PREVIEW_WORKER_NAME: flixoai-preview
      PREVIEW_ORIGIN: https://flixoai-preview.m1m2m3m4m5m6m700.workers.dev
    steps:
      - name: Checkout exact execution SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Build runtime
        run: npm run build:runtime

      - name: Stamp exact preview identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p dist/__flixo "dist/__flixo/identity/$EXPECTED_SHA"
          printf '%s\n' "$EXPECTED_SHA" > dist/flixo-head-sha.txt
          printf '%s\n' "$EXPECTED_SHA" > "dist/__flixo-identity-$EXPECTED_SHA.txt"
          printf '%s\n' "$EXPECTED_SHA" > dist/__flixo-identity.txt
          printf '%s\n' "$EXPECTED_SHA" > "dist/__flixo/identity/$EXPECTED_SHA/index.txt"
      - name: Validate preview credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Deploy isolated UI preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: deploy --config wrangler.jsonc --name ${{ env.PREVIEW_WORKER_NAME }} --var FLIXO_DEPLOYMENT_SHA:${{ github.sha }}

      - name: Verify preview endpoint
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          identity_url="${PREVIEW_ORIGIN}/__flixo-identity-${EXPECTED_SHA}.txt?__flixo_sha=${EXPECTED_SHA}&__flixo_verify=${GITHUB_RUN_ID}"
          status="$(curl --silent --show-error --location --compressed --retry 10 --retry-delay 3 --retry-all-errors --max-time 30 -o /tmp/flixo-preview-identity.txt -w '%{http_code}' "$identity_url")"
          body="$(tr -d '\r\n' < /tmp/flixo-preview-identity.txt)"
          test "$status" = "200"
          test "$body" = "$EXPECTED_SHA"

          root_status="$(curl --silent --show-error --location --compressed --retry 10 --retry-delay 3 --retry-all-errors --max-time 30 -o /tmp/flixo-preview.html -w '%{http_code}' "${PREVIEW_ORIGIN}/?__flixo_sha=${EXPECTED_SHA}&__flixo_verify=${GITHUB_RUN_ID}")"
          test "$root_status" = "200"
          grep -Eiq '<html[[:space:]>]' /tmp/flixo-preview.html

          echo "PREVIEW_URL=${PREVIEW_ORIGIN}"
          echo "PREVIEW_SHA=${EXPECTED_SHA}"
