name: CALL lab gate
on:
  pull_request:
    paths:
      - 'agent-lab/**'
      - 'packages/contracts/src/call-*.ts'
      - 'tests/call/**'
  push:
    branches: [lab, base, 'call/**']
permissions:
  contents: read
jobs:
  untrusted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate lab tool
        run: python3 agent-lab/tools/lab_tool.py validate --templates
      - name: Verify ledger
        run: python3 agent-lab/tools/lab_tool.py ledger-verify
  call-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run CALL agent and protocol tests
        run: npm run test:call-protocol
  gate:
    runs-on: ubuntu-latest
    needs: untrusted-tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Verify trusted gate source
        run: python3 agent-lab/tools/lab_tool.py paths
