name: CELL Assignment Delegation Contract

on:
  push:
    branches: [execution]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cell-assignment-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/execution' }}

jobs:
  contract:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.ref == 'execution' && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Assignment / Delegation exact-SHA contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify exact SHA before execution
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck contracts
        run: npm run typecheck:contracts
      - name: Assignment and delegation contract tests
        run: |
          set -euo pipefail
          node --import=./scripts/register-node-resolver.mjs --test --experimental-strip-types \
            tests/security/ci/cell-assignment-contract.test.ts \
            tests/security/ci/cell-runtime-contract.test.ts
      - name: Re-verify exact SHA after tests
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

