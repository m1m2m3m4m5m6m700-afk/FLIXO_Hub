name: FLIXO One-Shot Governance Repair

on:
  push:
    branches: [execution]
    paths:
      - governance-repair.trigger

permissions:
  contents: read

jobs:
  repair:
    name: Repair main protection exactly once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Repair and verify
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GOVERNANCE_REPAIR: "1"
        run: node scripts/ci/repair-main-governance.mjs
