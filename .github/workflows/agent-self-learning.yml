name: FLIXO Agent Self-Learning Control Plane

on:
  push:
    branches: [execution]
    paths-ignore:
      - 'الوكلاء/تدريب الوكلاء/تقارير التدريب/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flixo-agent-self-learning
  cancel-in-progress: true

jobs:
  train:
    name: Evaluate all agents against the self-learning contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify exact trigger SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run self-learning contract tests
        run: node --test tests/security/ci/agent-self-learning-control-plane.test.mjs tests/security/ci/agent-role-drills.test.mjs

      - name: Generate contract-readiness report
        run: node scripts/agent-learning/self-learning-control-plane.mjs "${GITHUB_SHA}"

      - name: Execute all role capability drills
        run: node scripts/agent-learning/run-role-drills.mjs "${GITHUB_SHA}"

      - name: Validate report identity
        shell: bash
        run: |
          set -euo pipefail
          REPORT="الوكلاء/تدريب الوكلاء/تقارير التدريب/${GITHUB_SHA}.md"
          test -s "$REPORT"
          grep -Fq -- "- Exact execution SHA: ${GITHUB_SHA}" "$REPORT"
          grep -Fq -- "Behavioral evidence: UNPROVEN" "$REPORT"

      - name: Reconcile execution HEAD before publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin execution
          test "$(git rev-parse origin/execution)" = "${GITHUB_SHA}" || {
            echo "FAIL_CLOSED: execution moved during training."
            exit 1
          }

      - name: Publish report to isolated learning branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FLIXO Agent Training"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REPORT="الوكلاء/تدريب الوكلاء/تقارير التدريب/${GITHUB_SHA}.md"
          ROLE_REPORT="الوكلاء/تدريب الوكلاء/تقارير التدريب/${GITHUB_SHA}-role-drills.md"
          REPORT_COPY="${RUNNER_TEMP}/flixo-training-${GITHUB_SHA}.md"
          ROLE_REPORT_COPY="${RUNNER_TEMP}/flixo-training-${GITHUB_SHA}-role-drills.md"
          cp "$REPORT" "$REPORT_COPY"
          cp "$ROLE_REPORT" "$ROLE_REPORT_COPY"

          if git ls-remote --exit-code --heads origin agent-learning >/dev/null 2>&1; then
            git fetch origin agent-learning
            git switch --create agent-learning --track origin/agent-learning
          else
            git switch --orphan agent-learning
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf 'الوكلاء/تدريب الوكلاء/تقارير التدريب'
          mkdir -p 'الوكلاء/تدريب الوكلاء/تقارير التدريب'
          cp "$REPORT_COPY" "$REPORT"
          cp "$ROLE_REPORT_COPY" "$ROLE_REPORT"
          git add 'الوكلاء/تدريب الوكلاء/تقارير التدريب/'
          git diff --cached --name-only
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs(training): publish agent readiness ${GITHUB_SHA}"
          git push origin "HEAD:agent-learning"