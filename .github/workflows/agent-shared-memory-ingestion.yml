name: FLIXO Agent Shared Memory Ingestion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flixo-agent-shared-memory-ingestion
  cancel-in-progress: true

jobs:
  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/execution' && github.repository == 'm1m2m3m4m5m6m700-afk/FLIXO_Hub' && github.actor == 'm1m2m3m4m5m6m700-afk' }}
    name: Ingest evidence-backed scout proposals into shared memory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact execution SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Require shared-memory credentials when candidate reports exist
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES=$(find 'الوكلاء/التقارير' -type f -name 'اقتراح-*.yaml' | wc -l)
          if [ "${CANDIDATES}" -gt 0 ]; then
            test -n "${SUPABASE_URL:-}"
            test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Ingest canonical scout reports
        env:
          GITHUB_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/agent-learning/ingest-report-learning.mjs

      - name: Reconcile execution SHA after ingestion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin execution --no-tags
          test "$(git rev-parse origin/execution)" = "${GITHUB_SHA}"
