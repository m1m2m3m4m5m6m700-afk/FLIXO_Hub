name: FLIXO Community Label Bootstrap

on:
  push:
    branches: [main, execution]
    paths:
      - .github/workflows/community-bootstrap.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    name: Ensure contributor labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or update contributor labels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          gh label create "good first issue" --repo "$repo" --color "7057ff" --description "A scoped task suitable for a first-time contributor." --force
          gh label create "help wanted" --repo "$repo" --color "008672" --description "A task where maintainers welcome community help." --force
          gh label create "documentation" --repo "$repo" --color "0075ca" --description "Documentation or developer guidance." --force
          gh label create "testing" --repo "$repo" --color "5319e7" --description "Tests, regression coverage, or test tooling." --force
          gh label create "accessibility" --repo "$repo" --color "1d76db" --description "Accessibility, keyboard, screen-reader, or usability barriers." --force
          gh label create "developer-platform" --repo "$repo" --color "fbca04" --description "Developer platform, workspace, contribution, or agent surfaces." --force
          gh label create "i18n" --repo "$repo" --color "cfd3d7" --description "Internationalization and localization." --force
          echo "COMMUNITY_LABEL_BOOTSTRAP=PASS"
