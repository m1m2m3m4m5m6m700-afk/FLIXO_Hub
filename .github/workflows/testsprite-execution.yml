name: TestSprite Live E2E (execution)

on:
  push:
    branches:
      - execution
  workflow_dispatch:

concurrency:
  group: testsprite-execution-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# execution is intentionally unprotected. This workflow MUST remain secretless.
# External TestSprite credentials are prohibited on this branch. Use the native
# exact-SHA Playwright suite instead so a branch write cannot expose provider
# secrets or turn the test runner into a credential-bearing trust boundary.
jobs:
  native-e2e:
    if: ${{ github.repository == 'm1m2m3m4m5m6m700-afk/FLIXO_Hub' && github.ref == 'refs/heads/execution' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Fail-closed trusted execution boundary
        env:
          TRUSTED_REPOSITORY: m1m2m3m4m5m6m700-afk/FLIXO_Hub
          TRUSTED_REF: refs/heads/execution
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "$TRUSTED_REPOSITORY"
          test "$REF" = "$TRUSTED_REF"
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "FAIL_CLOSED: unexpected event=$EVENT_NAME" >&2; exit 1 ;;
          esac

      - name: Checkout exact execution SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify exact execution SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run exact-SHA native Chromium E2E
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          PLAYWRIGHT_REUSE_SERVER=true npm run test:e2e -- --project=chromium

      - name: Write secretless evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '{"workflow":"execution-native-e2e","sha":"%s","externalSecrets":"prohibited","status":"PASS"}\n' "$(git rev-parse HEAD)" > execution-e2e-evidence.json

      - name: Upload execution E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-e2e-evidence-${{ github.sha }}
          path: execution-e2e-evidence.json
          if-no-files-found: error
          retention-days: 14
