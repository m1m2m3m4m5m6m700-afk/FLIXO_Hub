name: TestSprite Live E2E (execution)
on:
  push:
    branches:
      - execution
    paths:
      - 'src/routes/**'
      - 'src/components/**'
      - 'src/lib/**'
      - 'src/config/**'
      - 'src/tools/**'
      - 'tests/e2e/**'
      - 'playwright.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/testsprite-execution.yml'
  workflow_dispatch:

concurrency:
  group: testsprite-execution-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testsprite:
    if: ${{ github.repository == 'm1m2m3m4m5m6m700-afk/FLIXO_Hub' && github.ref == 'refs/heads/execution' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Fail-closed canonical execution boundary
        env:
          TRUSTED_REPOSITORY: m1m2m3m4m5m6m700-afk/FLIXO_Hub
          TRUSTED_REF: refs/heads/execution
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "$TRUSTED_REPOSITORY"
          test "$REF" = "$TRUSTED_REF"
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) exit 1 ;;
          esac

      - name: Checkout exact execution SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify exact execution SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Native exact-SHA E2E fallback
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/ci/testsprite-fallback.mjs

      - name: Upload exact-SHA fallback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testsprite-results-${{ github.sha }}
          path: |
            testsprite-fallback
            test-results
          if-no-files-found: ignore
          retention-days: 30
