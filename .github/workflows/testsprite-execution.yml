name: TestSprite Live E2E (execution)

on:
  push:
    branches:
      - execution
  workflow_dispatch:

concurrency:
  group: testsprite-fallback-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testsprite:
    if: ${{ github.repository == 'm1m2m3m4m5m6m700-afk/FLIXO_Hub' && github.ref == 'refs/heads/execution' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Fail-closed trusted TestSprite execution boundary
        env:
          TRUSTED_REPOSITORY: m1m2m3m4m5m6m700-afk/FLIXO_Hub
          TRUSTED_REF: refs/heads/execution
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "$TRUSTED_REPOSITORY"
          test "$REF" = "$TRUSTED_REF"
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "FAIL_CLOSED: TestSprite secrets are prohibited for event=$EVENT_NAME" >&2; exit 1 ;;
          esac

      - name: Checkout exact execution SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start FLIXO
        shell: bash
        run: |
          set -euo pipefail
          npm run build:runtime
          nohup npm run preview -- --host 127.0.0.1 --port 3000 >/tmp/flixo-vite.log 2>&1 &
          echo $! >/tmp/flixo-vite.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "FLIXO is live on http://127.0.0.1:3000"
              exit 0
            fi
            sleep 2
          done
          echo "::error::FLIXO did not become reachable on port 3000."
          cat /tmp/flixo-vite.log
          exit 1

      - name: Install pinned TestSprite CLI
        run: npm install --global @testsprite/testsprite-cli@0.4.0

      - name: Validate committed manual TestSprite plans offline
        run: testsprite test lint --plan-from-dir .testsprite/plans

      - name: Verify exact execution SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Native exact-SHA canonical ten-tool E2E fallback
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/ci/testsprite-fallback.mjs
      - name: Upload TestSprite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testsprite-results-${{ github.sha }}
          path: |
            testsprite-junit.xml
            testsprite-summary.json
            .testsprite/manual-test-ids.txt
            .testsprite/runtime-plans
            /tmp/flixo-vite.log
            testsprite-fallback
            test-results
            playwright-report/results.json
          if-no-files-found: ignore
