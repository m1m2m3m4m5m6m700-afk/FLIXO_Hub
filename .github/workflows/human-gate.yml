name: FLIXO Agent-3 Human Gate

on:
  workflow_dispatch:
    inputs:
      proposal:
        description: 'Review card ID (RQ-...) or proposal ID'
        required: true
        type: string
      decision:
        description: 'Human decision'
        required: true
        type: choice
        options:
          - approved
          - rejected
          - deferred
      note:
        description: 'Human review note'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: flixo-agent3-human-gate
  cancel-in-progress: false

jobs:
  gate:
    name: Human decision gate
    permissions:
      contents: read
    env:
      FLIXO_TARGET_BRANCH: execution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject bot actors
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_ACTOR" in
            *"[bot]"|"github-actions"|"dependabot")
              echo "FAIL_CLOSED: automated actor cannot approve/reject/defer"
              exit 1
              ;;
          esac
          test -n "$GITHUB_ACTOR"

      - name: Checkout exact execution branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: execution
          fetch-depth: 0
          persist-credentials: false

      - name: Assert dispatch ref is execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "execution"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/execution)"

      - name: Apply human decision
        shell: bash
        env:
          PROPOSAL: ${{ inputs.proposal }}
          DECISION: ${{ inputs.decision }}
          NOTE: ${{ inputs.note }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python3 .agent-intelligence/scripts/triage.py gate             --proposal "$PROPOSAL"             --decision "$DECISION"             --actor "$ACTOR"             --note "$NOTE"             > human-gate-result.json
          python3 .agent-intelligence/scripts/triage.py verify

      - name: Create immutable human-gate publication patch
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$TARGET_SHA" > human-gate-publication-sha.txt
          git diff --binary --full-index > human-gate-publication.patch
          git diff --name-only > human-gate-changed-files.txt
          test -s human-gate-publication.patch
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .agent-intelligence/review-queue/*|.agent-intelligence/handoffs/*|التطوير.md) ;;
              *) echo "FAIL_CLOSED: unexpected human-gate mutation: $path"; exit 1 ;;
            esac
          done < human-gate-changed-files.txt

      - name: Upload human-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flixo-agent3-human-gate-${{ github.run_id }}
          path: |
            human-gate-result.json
            human-gate-publication.patch
            human-gate-publication-sha.txt
            human-gate-changed-files.txt
          if-no-files-found: error
          retention-days: 30
