name: FLIXO المستكشف AI Wake

on:
  push:
    branches: [execution]
    paths-ignore:
      - 'الوكلاء/المستكشف AI/تقارير المستكشف/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flixo-repository-knowledge
  cancel-in-progress: true

jobs:
  knowledge:
    name: Read complete repository and produce SHA-bound knowledge report
    permissions:
      contents: read
    env:
      FLIXO_TARGET_BRANCH: knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Verify trigger identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run complete repository knowledge scan
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-knowledge-scan.mjs

      - name: Validate exact-trigger report
        shell: bash
        run: |
          set -euo pipefail
          REPORT="الوكلاء/المستكشف AI/تقارير المستكشف/${GITHUB_SHA}.md"
          test -s "$REPORT"
          grep -Fq -- "- Exact SHA: ${GITHUB_SHA}" "$REPORT"
          grep -Fq -- "- Uncovered repository-authored text lines: 0" "$REPORT"

      - name: Fetch main branch snapshot for read-only knowledge tests
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin "$MAIN_SHA" --depth=1
          echo "FLIXO_KNOWLEDGE_MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"

      - name: Run strict knowledge-agent contract tests
        env:
          ALLOW_KNOWLEDGE_LIMITATIONS: "1"
        run: node --test tests/security/ci/repository-knowledge-agent.test.mjs

      - name: Upload validated knowledge report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flixo-knowledge-report-${{ github.run_id }}
          path: |
            الوكلاء/المستكشف AI/تقارير المستكشف/${{ github.sha }}.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated knowledge report
    needs: knowledge
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact-SHA report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flixo-knowledge-report-${{ github.run_id }}
          path: /tmp/flixo-knowledge-report

      - name: Reconcile and publish report without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          REPORT="/tmp/flixo-knowledge-report/الوكلاء/المستكشف AI/تقارير المستكشف/${GITHUB_SHA}.md"
          test -s "$REPORT"
          grep -Fq -- "- Exact SHA: ${GITHUB_SHA}" "$REPORT"

          if git ls-remote --exit-code --heads origin knowledge >/dev/null 2>&1; then
            git fetch origin knowledge
            git switch --create knowledge --track origin/knowledge
          else
            git switch --orphan knowledge
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf 'الوكلاء/المستكشف AI/تقارير المستكشف'
          mkdir -p 'الوكلاء/المستكشف AI/تقارير المستكشف'
          cp "$REPORT" 'الوكلاء/المستكشف AI/تقارير المستكشف/${GITHUB_SHA}.md'

          git add 'الوكلاء/المستكشف AI/تقارير المستكشف/'
          test -n "$(git diff --cached --name-only)"
          git diff --cached --name-only
          git commit -m "docs(knowledge): publish execution SHA ${GITHUB_SHA}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer $GITHUB_TOKEN" push origin "HEAD:knowledge"
