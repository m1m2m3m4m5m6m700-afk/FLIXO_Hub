name: FLIXO المستكشف AI Wake
on:
  push:
    branches: [execution]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/agents/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'wrangler.jsonc'
      - 'AGENTS.md'
      - 'الوكلاء.md'
      - 'الأدوات.md'
      - 'المهام.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flixo-repository-knowledge
  cancel-in-progress: true

jobs:
  knowledge:
    name: Read complete repository and publish SHA-bound knowledge artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install project dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify trigger identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run complete repository knowledge scan
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/repository-knowledge-scan.mjs

      - name: Validate exact-trigger report
        shell: bash
        run: |
          set -euo pipefail
          REPORT="الوكلاء AI/المستكشف AI/تقارير المستكشف/${GITHUB_SHA}.md"
          test -s "$REPORT"
          SNAPSHOT="الوكلاء AI/المستكشف AI/تقارير المستكشف/${GITHUB_SHA}.json"
          test -s "$SNAPSHOT"
          grep -Fq -- "- Exact SHA: ${GITHUB_SHA}" "$REPORT"
          grep -Fq -- "- Model version: flixo-world-model-v1" "$REPORT"
          grep -Fq -- '"exact_sha": "'${GITHUB_SHA}'"' "$SNAPSHOT"
          grep -Fq -- '"model_version": "flixo-world-model-v1"' "$SNAPSHOT"
          grep -Fq -- "- Uncovered repository-authored text lines: 0" "$REPORT"

      - name: Fetch main branch snapshot for read-only knowledge tests
        run: git fetch origin main --depth=1

      - name: Run strict knowledge-agent contract tests
        env:
          ALLOW_KNOWLEDGE_LIMITATIONS: "1"
        run: node --test tests/security/ci/repository-knowledge-agent.test.mjs

      - name: Upload SHA-bound knowledge artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flixo-knowledge-${{ github.sha }}
          path: |
            الوكلاء AI/المستكشف AI/تقارير المستكشف/${{ github.sha }}.md
            الوكلاء AI/المستكشف AI/تقارير المستكشف/${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
