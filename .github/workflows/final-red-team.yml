name: FLIXO Final Clean-Clone Red Team

on:
  push:
    branches: [execution]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: flixo-final-red-team-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  final-red-team:
    name: Prompt 17 clean-clone final adversarial gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      VITE_SITE_URL: 'https://flixoai.m1m2m3m4m5m6m700.workers.dev'
      VITE_RUNTIME_ORIGIN: 'http://127.0.0.1:3000'
      VITE_TEST_ORIGIN: 'http://127.0.0.1:3000'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact identity before tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'EXPECTED_SHA=%s\n' "$EXPECTED_SHA" > final-red-team-evidence.txt

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fresh install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Core and contract regression
        run: npm run test:core

      - name: Adversarial control-plane regression
        run: npm run test:red-team

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Stamp exact build identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf '%s\n' "$EXPECTED_SHA" > dist/flixo-head-sha.txt
          printf '%s\n' "$EXPECTED_SHA" > "dist/__flixo-identity-$EXPECTED_SHA.txt"
          printf '%s\n' "$EXPECTED_SHA" > dist/__flixo-identity.txt
          mkdir -p "dist/__flixo/identity/$EXPECTED_SHA"
          printf '%s\n' "$EXPECTED_SHA" > "dist/__flixo/identity/$EXPECTED_SHA/index.txt"

      - name: Verify build artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/flixo-head-sha.txt
          test "$(cat dist/flixo-head-sha.txt)" = "$EXPECTED_SHA"

      - name: Exact-SHA coverage
        run: npm run test:coverage

      - name: Browser E2E
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium tests/official/mvp-10-release-verification.spec.ts

      - name: Publish browser failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f playwright-report/results.json || { echo 'No Playwright results JSON produced.'; exit 0; }
          node > /tmp/flixo-browser-failure.md <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('playwright-report/results.json', 'utf8'));
          const failures = [];
          const walk = (suite, path = []) => {
            for (const spec of suite.specs ?? []) {
              for (const test of spec.tests ?? []) {
                const failed = (test.results ?? []).filter((result) => result.status === 'failed' || result.status === 'timedOut');
                if (failed.length) {
                  failures.push({
                    title: [...path, spec.title].filter(Boolean).join(' / '),
                    project: test.projectName,
                    expected: test.expectedStatus,
                    attempts: failed.map((result) => ({
                      status: result.status,
                      duration: result.duration,
                      errors: (result.errors ?? []).map((error) => String(error.message ?? error).slice(0, 4000)),
                    })),
                  });
                }
              }
            }
            for (const child of suite.suites ?? []) walk(child, [...path, suite.title].filter(Boolean));
          };
          for (const suite of data.suites ?? []) walk(suite);
          const lines = [
            '## FLIXO Browser E2E diagnostic',
            '',
            'Exact SHA: ' + process.env.EXPECTED_SHA,
            'Failed tests: ' + failures.length,
            '',
          ];
          for (const failure of failures.slice(0, 20)) {
            lines.push('### ' + failure.title);
            lines.push('- Project: ' + (failure.project ?? 'unknown'));
            lines.push('- Expected: ' + (failure.expected ?? 'unknown'));
            for (const attempt of failure.attempts) {
              lines.push('- Attempt status: ' + attempt.status + '; durationMs=' + attempt.duration);
              for (const error of attempt.errors) lines.push('```text\\n' + error + '\\n```');
            }
            lines.push('');
          }
          process.stdout.write(lines.join('\\n'));
          NODE
          printf '\\n\\nThis diagnostic is emitted only because Browser E2E failed; no PASS is inferred from it.\\n' >> /tmp/flixo-browser-failure.md
          PR_NUMBER="$(gh pr list --state open --head execution --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/flixo-browser-failure.md
          else
            cat /tmp/flixo-browser-failure.md
          fi
      - name: Wait for exact-SHA security workflows
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_SHA&event=push&per_page=100")"
            all_ok=true
            for workflow in "FLIXO CodeQL" "FLIXO Secret Scan"; do
              state="$(printf '%s' "$runs" | WORKFLOW="$workflow" EXPECTED_SHA="$EXPECTED_SHA" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=(JSON.parse(s).workflow_runs||[]).filter(r=>r.head_sha===process.env.EXPECTED_SHA&&r.name===process.env.WORKFLOW);const r=x[0];console.log(r?`${r.status}:${r.conclusion||"null"}`:"MISSING")})')"
              echo "$workflow => $state"
              case "$state" in
                completed:success) ;;
                completed:*) echo "FAIL_CLOSED: security workflow $workflow => $state"; exit 1 ;;
                *) all_ok=false ;;
              esac
            done
            if [ "$all_ok" = true ]; then echo "EXACT_SHA_SECURITY=PASS"; exit 0; fi
            sleep 10
          done
          echo "FAIL_CLOSED: timed out waiting for exact-SHA security workflows"
          exit 1
      - name: Structural scope and artifact evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/lcov.info
          grep -q '^SF:' coverage/lcov.info
          grep -q '^LF:[0-9][0-9]*$' coverage/lcov.info
          grep -q '^LH:[0-9][0-9]*$' coverage/lcov.info
          printf '%s\n' "$EXPECTED_SHA" > coverage/exact-sha.txt
          sha256sum coverage/lcov.info | awk '{print $1}' > coverage/lcov.sha256
          cat >> final-red-team-evidence.txt <<EOF
          TYPECHECK=PASS
          LINT=PASS
          CORE=PASS
          RED_TEAM=PASS
          AUDIT=PASS
          COVERAGE=PASS
          BROWSER_E2E=PASS
          GOVERNANCE=SEPARATE_GATE
          SECURITY_WORKFLOWS=PASS
          EOF

      - name: Upload final Red Team evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flixo-final-red-team-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            final-red-team-evidence.txt
            coverage
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
