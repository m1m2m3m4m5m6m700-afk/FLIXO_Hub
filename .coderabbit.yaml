language: "en-US"
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "execution"
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  path_instructions:
    - path: "/.github/workflows/**"
      instructions: |
        Treat the GitHub workflow control plane as security-sensitive.
        Require least privilege, exact-SHA checkout/action pinning, fail-closed behavior,
        exact-head identity checks, and no credential or authorization-header logging.
        Flag any workflow self-approval, gate bypass, unpinned third-party action,
        branch creation, force-push, merge, or promotion mutation by external workers.
    - path: "/.github/CODEOWNERS"
      instructions: |
        Treat repository ownership policy as security-sensitive.
        Require explicit CODEOWNER coverage for workflows, CI scripts, contracts,
        worker/deployment configuration, API, and Supabase control-plane code.
    - path: "/scripts/ci/**"
      instructions: |
        Treat CI control-plane scripts as canonical.
        Require exact-SHA binding, stale-evidence rejection, deterministic fail-closed
        gates, and no hidden skip/continue-on-error behavior.
    - path: "/src/lib/contracts/**"
      instructions: |
        Treat contracts as canonical authority.
        Do not introduce a second registry, execution boundary, safety authority,
        verifier authority, or certification mechanism.
    - path: "/src/lib/execution/**"
      instructions: |
        Treat the canonical execution boundary as the only programmatic execution path.
        Every execution must resolve a canonical capability, validate parameters,
        enforce safety/resource limits, execute, verify output, and fail closed.
    - path: "/src/lib/developer/**"
      instructions: |
        Treat external developer tooling as adapters only.
        mini-SWE-agent may propose sandbox patches; canonical FLIXO code remains
        mutation authority. CodeRabbit is an independent reviewer only.
        Flag secrets, direct GitHub writes, branch creation, stale-SHA evidence,
        and promotion gate bypasses.
    - path: "/tests/**"
      instructions: |
        Preserve deterministic exact-SHA, stale-evidence, authority-boundary,
        and negative-path assertions. Never weaken, delete, skip, or mask tests.
chat:
  auto_reply: true
