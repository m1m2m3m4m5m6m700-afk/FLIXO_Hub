evidence:
  quote: "Hexagonal architecture pattern - AWS Prescriptive Guidance\nView a markdown version of this page\nHexagonal architecture pattern - AWS Prescriptive Guidance\nDocumentation\nAWS Prescriptive Guidance\nCloud design patterns, architectures, and implementations\nIntent\nMotivation\nApplicability\nIssues and considerations\nImplementation\nRelated content\nVideos\nHexagonal architecture pattern\nIntent\nThe hexagonal architecture pattern, which is also known as the ports and adapters pattern, was proposed by Dr. Alistair Cockburn in 2005. It aims to create loosely coupled architectures where application components can be tested independently, with no dependencies on data stores or user interfaces (UIs). This pattern helps prevent technology lock-in of data stores and UIs. This makes it easier to change the technology stack over time, with limited or no impact to business logic. In this loosely coupled architecture, the application communicates with external components over interfaces called\nports\n, and uses\nadapters\nto translate the technical exchanges with these components.\nMotivation\nThe hexagonal architecture pattern is used to isolate business logic (domain logic) from related infrastructure code,"
